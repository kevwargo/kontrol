# Example
#
# <command-id>:
#   key: string
#   # exactly one of the following can be specified
#   shell: string
#   cmd: string[]
#   prompt: string
#   snippet:
#     text: string
#     cmd: string
#     notify:
#       details: boolean
#       timeout: number

bt-on:
  key: Meta+Shift+B
  shell: rfkill unblock bluetooth
bt-off:
  key: Meta+Alt+B
  shell: rfkill block bluetooth
kscreen-toggle:
  key: Meta+Alt+X
  shell: kscreen-toggle
open-foot:
  key: Meta+Shift+T
  shell: foot -w 1200x800
email:
  key: Meta+Alt+2
  snippet:
    text: jarasz.kevwargo@gmail.com
    notify:
      details: true
mfa-github:
  key: Meta+Shift+G
  snippet:
    cmd: mfacli --password-command ksshaskpass print github
    notify:
      details: true
      timeout: 1000
dtt:
  key: Meta+Alt+D
  snippet:
    cmd: date +%Y%m%d-%H%M%S
    notify:
      details: true
restart-plasmashell:
  key: Meta+Shift+Ctrl+K
  shell: kquitapp6 plasmashell && kstart plasmashell
move-left:
  key: Meta+Left
  builtinId: activeWindowToLeftEdge
  description: Move active window to left screen edge
move-right:
  key: Meta+Right
  builtinId: activeWindowToRightEdge
  description: Move active window to right screen edge
move-up:
  key: Meta+Up
  builtinId: activeWindowToTopEdge
  description: Move active window to top screen edge
move-down:
  key: Meta+Down
  builtinId: activeWindowToBottomEdge
  description: Move active window to bottom screen edge
center-window:
  key: Meta+|
  builtinId: centerActiveWindow
  description: Move active window to screen center
