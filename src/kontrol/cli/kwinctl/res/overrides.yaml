kmix:
  decrease_volume:
    name: Decrease Volume
    keys:
      - Meta+F2
      - Volume Down
  increase_volume:
    name: Increase Volume
    keys:
      - Meta+F3
      - Volume Up
  mute:
    name: Mute
    keys:
      - Meta+F1
      - Volume Mute
kwin:
